name: Publicar update (EAS — não usar)

# ⚠ NÃO É ESTE O WORKFLOW A USAR. A app compila-se e actualiza-se só pelo **Gerar APK (Gradle)**, sem EAS e sem
# conta na Expo (ADR 0008). Sem EAS não há entrega de JavaScript pelo ar: qualquer alteração é um APK novo. Este ficou no repositório para o dia em que se queira voltar ao EAS, e
# chama-se "(EAS)" para não se confundir com o outro na lista do separador Actions — foi o que
# aconteceu a 2026-09-26, quando este foi disparado por engano e teve de ser cancelado.
#
# Entrega alterações de JavaScript ao telemóvel sem APK novo: a app vai buscá-las ao arrancar.
#
# Serve para quase tudo — écrans, lógica, correcções. NÃO serve quando muda alguma coisa nativa:
# uma dependência com código nativo, uma permissão, o ícone, a versão do SDK. Nesses casos é o
# workflow "Gerar APK (EAS — não usar)".
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal (tem de bater certo com o perfil do APK instalado)'
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: 'O que vai neste update'
        type: string
        default: 'Update'

concurrency:
  group: publish-update
  cancel-in-progress: false

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci --legacy-peer-deps

      # Um update entra no telemóvel sem passar por mais lado nenhum. Se o código não compila, a
      # app abre partida — e não há loja nem revisão pelo meio a apanhar isso.
      - name: Validar antes de publicar
        run: npm run check

      - name: Publicar
        run: npx eas-cli update --branch ${{ inputs.channel }} --message "${{ inputs.message }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
