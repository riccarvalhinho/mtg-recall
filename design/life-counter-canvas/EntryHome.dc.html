<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <style>
    body { margin: 0; background: #130F0A; }
    a { color: #C9A96E; } a:hover { color: #8B7248; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #130F0A; display: flex; flex-direction: column; overflow: hidden; font-family: 'EB Garamond', Georgia, serif;">

  <!-- Header: the casual entry lives here, next to New Event -->
  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 20px 12px; flex-shrink: 0;">
    <div>
      <div style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: #8B7248; margin-bottom: 2px;">Scholar&#39;s Archive</div>
      <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 34px; color: #E8DCC8;">Home</div>
    </div>
    <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 4px;">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <div style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid rgba(201,169,110,0.45); display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C9A96E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 2.5-3.2 2.5-5.1A4.9 4.9 0 0 0 12 6.6 4.9 4.9 0 0 0 2.5 8.9C2.5 13 7 16.5 12 21c2.1-1.9 4.2-3.7 5.7-5.3"/></svg>
        </div>
      </div>
      <div style="background: #C9A96E; border-radius: 20px; padding: 7px 14px;">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 13px; color: #130F0A;">+ New Event</span>
      </div>
    </div>
  </div>

  <!-- Active Event label -->
  <div style="display: flex; align-items: center; gap: 8px; margin: 4px 16px 10px; flex-shrink: 0;">
    <div style="width: 3px; height: 14px; border-radius: 2px; background: linear-gradient(180deg, #C9A96E, #8B7248);"></div>
    <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: #C9A96E;">Active Event</span>
  </div>

  <!-- The hero card, 52% of the screen -->
  <div style="margin: 0 16px; height: 439px; border-radius: 16px; border: 1px solid rgba(201,169,110,0.33); background: #1E1812; overflow: hidden; position: relative; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0;">

    <!-- Stand-in for the deck art the real card pulls from Scryfall -->
    <div style="position: absolute; inset: 0; background: radial-gradient(120% 80% at 25% 18%, #3A2E1E 0%, #241C14 45%, #171209 100%);"></div>
    <div style="position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); opacity: 0.16;">
      <svg width="190" height="190" viewBox="0 0 190 190" fill="none">
        <circle cx="95" cy="95" r="76" stroke="#C9A96E" stroke-width="0.9" stroke-dasharray="3 5" stroke-opacity="0.7"/>
        <circle cx="95" cy="95" r="56" stroke="#8B7248" stroke-width="0.7"/>
        <path d="M95 26 L160 73 L135 150 L55 150 L30 73 Z" stroke="#8B7248" stroke-width="0.7" fill="none"/>
        <path d="M95 26 L135 150 M95 26 L55 150 M160 73 L55 150 M160 73 L30 73 M30 73 L135 150" stroke="#8B7248" stroke-width="0.6" stroke-opacity="0.8"/>
      </svg>
    </div>
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,8,5,0.62) 0%, rgba(10,8,5,0) 28%, rgba(10,8,5,0.70) 60%, rgba(10,8,5,0.97) 100%);"></div>

    <!-- Top badges -->
    <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px;">
      <div style="display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; background: rgba(201,169,110,0.15); border: 1px solid rgba(201,169,110,0.47);">
        <div style="width: 6px; height: 6px; border-radius: 3px; background: #C9A96E;"></div>
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: #C9A96E;">Live</span>
      </div>
      <div style="padding: 4px 10px; border-radius: 11px; border: 1px solid #3A3020; background: rgba(19,15,10,0.7);">
        <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: #A8967A;">Sealed</span>
      </div>
    </div>

    <!-- Bottom block -->
    <div style="position: relative; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 32px; color: #E8DCC8;">FNM Sealed &mdash; Aetherdrift</div>

      <div style="display: flex; align-items: center; gap: 5px;">
        <div style="width: 14px; height: 14px; border-radius: 7px; background: #1A1020; border: 1px solid #3A2A48;"></div>
        <div style="width: 14px; height: 14px; border-radius: 7px; background: #3A100E; border: 1px solid #5A2018;"></div>
        <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 12px; color: #6B5C3E; margin: 0 2px;">&middot;</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#6B5C3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 12px; color: #A8967A;">14 Sep 2026</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; margin-top: 2px;">
        <div style="display: flex; align-items: baseline; gap: 4px;">
          <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 34px; color: #5A8B5C;">2</span>
          <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 22px; color: #6B5C3E;">&ndash;</span>
          <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 34px; color: #8B4A4A;">0</span>
        </div>
        <div style="width: 1px; height: 26px; background: #3A3020;"></div>
        <div style="display: flex; flex-direction: column; align-items: flex-start;">
          <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 17px; color: #E8DCC8;">100%</span>
          <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase; color: #A8967A;">win rate</span>
        </div>
        <div style="width: 1px; height: 26px; background: #3A3020;"></div>
        <div style="display: flex; flex-direction: column; align-items: flex-start;">
          <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 17px; color: #E8DCC8;">6</span>
          <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase; color: #A8967A;">points</span>
        </div>
      </div>

      <!-- The action row splits: register stays primary, the counter sits beside it -->
      <div style="display: flex; gap: 10px; margin-top: 4px;">
        <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-radius: 12px; background: #C9A96E;">
          <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 18px; line-height: 20px; color: #130F0A;">+</span>
          <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 15px; color: #130F0A;">Register round 3</span>
        </div>
        <div style="width: 50px; border-radius: 12px; border: 1px solid rgba(201,169,110,0.5); background: rgba(201,169,110,0.09); display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9A96E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 2.5-3.2 2.5-5.1A4.9 4.9 0 0 0 12 6.6 4.9 4.9 0 0 0 2.5 8.9C2.5 13 7 16.5 12 21c2.1-1.9 4.2-3.7 5.7-5.3"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Stats block -->
  <div style="margin: 16px; display: flex; align-items: center; background: #1E1812; border: 1px solid #3A3020; border-radius: 14px; padding: 14px 0; flex-shrink: 0;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 22px; color: #E8DCC8;">12</span>
      <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase; color: #6B5C3E;">Events</span>
    </div>
    <div style="width: 1px; height: 28px; background: #3A3020;"></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 22px; color: #E8DCC8;">61%</span>
      <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase; color: #6B5C3E;">Win rate</span>
    </div>
  </div>

  <!-- Recent events, clipped by the fold like the real scroll view -->
  <div style="margin: 0 16px; display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0;">
    <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; color: #6B5C3E;">Recent Events</span>
    <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 12px; color: #6B5C3E;">See all &rarr;</span>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- Tab bar -->
  <div style="height: 64px; flex-shrink: 0; background: #16120D; border-top: 1px solid #3A3020; display: flex; align-items: center; padding-top: 6px; box-sizing: border-box;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8DCC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 10px; letter-spacing: 0.3px; color: #E8DCC8;">Home</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B5C3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 10px; letter-spacing: 0.3px; color: #6B5C3E;">Events</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B5C3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 10px; letter-spacing: 0.3px; color: #6B5C3E;">Decks</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B5C3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 10px; letter-spacing: 0.3px; color: #6B5C3E;">Stats</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B5C3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9.6a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9.6a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 10px; letter-spacing: 0.3px; color: #6B5C3E;">Settings</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
