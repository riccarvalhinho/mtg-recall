<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <style>
    body { margin: 0; background: #130F0A; }
    a { color: #C9A96E; } a:hover { color: #8B7248; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #130F0A; display: flex; flex-direction: column; overflow: hidden; font-family: 'EB Garamond', Georgia, serif;">

  <!-- Opponent half shrinks to make room for the band -->
  <div style="height: 300px; position: relative; background: #1A150F; transform: rotate(180deg);">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <div style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #8B7248;">Opponent</div>
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 128px; line-height: 1; color: #8B4A4A;">0</span>
    </div>
  </div>

  <!-- The band: the seam grows into the only thing that matters for two seconds -->
  <div style="height: 244px; background: #16120D; border-top: 1px solid rgba(90,139,92,0.55); border-bottom: 1px solid rgba(90,139,92,0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 16px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: #6B5C3E;">Game 1</div>
      <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 32px; line-height: 1.1; color: #5A8B5C;">Won</div>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 19px; color: #E8DCC8;">14</span>
        <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 15px; color: #6B5C3E;">&ndash;</span>
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 19px; color: #8B4A4A;">0</span>
        <span style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 12px; color: #6B5C3E; margin-left: 4px;">saved with the round</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px; width: 100%;">
      <div style="width: 92px; height: 52px; border-radius: 12px; border: 1px solid #3A3020; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 14px; color: #A8967A;">Undo</span>
      </div>
      <div style="flex-grow: 1; height: 52px; border-radius: 12px; background: #C9A96E; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 15px; color: #130F0A;">Game 2</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#130F0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="width: 92px; height: 52px; border-radius: 12px; border: 1px solid #3A3020; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 14px; color: #A8967A;">Finish</span>
      </div>
    </div>
  </div>

  <!-- My half -->
  <div style="height: 300px; position: relative; background: #1E1812;">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <div style="font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #8B7248;">You</div>
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 128px; line-height: 1; color: #E8DCC8;">14</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
